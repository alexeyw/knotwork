name: Instrumented

# Runs the instrumented (`app/src/androidTest/`) suite on emulators.
#
# Why this is a separate workflow rather than a job inside `check.yml`:
# `release.yml` reuses `check.yml` verbatim as its first job, so anything added
# there also gates a signed release built from a tag. An emulator downloads
# system images, boots a virtual machine and talks to it over adb — it can fail
# for reasons the repository did not cause, and a release must never be blocked
# by that class of failure. The split follows the project's own rule that a
# build's verdict has to be a function of the repository's contents:
#
#   * the DETERMINISTIC half — whether the instrumented sources still compile —
#     lives in `check.yml`, where it gates every pull request and every release;
#   * the EXECUTION half lives here, outside the release path.
#
# Infrastructure failures are not swept under the rug: `run-instrumented.sh`
# separates them from failures attributable to the repository, retries only the
# former (at most once) and labels the job so the difference is readable without
# opening the log. The job
# still goes red for both — a gate that turns green when its environment
# misbehaves has stopped being a gate.
#
# Matrix: API 36 x both distribution flavours. The second axis is the flavour
# rather than a second API level, and that was decided by measurement rather
# than taste.
#
# The intended shape was floor + `targetSdk`, API 36 and API 37. Neither
# alternative API level survives contact with this app:
#
#   * **API 37** never reaches our script. The image boots, and then the
#     emulator action's own post-boot `adb shell input keyevent 82` — which no
#     input can disable — dies with `Failure calling service input: Broken pipe`.
#     0 of 2 runs.
#   * **API 36.1** failed 0 of 3 runs, at a different layer each time: the AVD
#     disk, then the keyguard, then `install-write`. The first two produced real
#     fixes that hardened the API 36 leg as well, which is most of what a matrix
#     is for; the third has no fix in sight, and 36.1 is still Android 16, so
#     what it would add over API 36 is a patch level rather than an API surface.
#
# API 36 has been green 3 runs out of 3 with the full suite. So the honest
# second configuration is the one we actually ship twice: `full` and `foss`.
# `foss` is what F-Droid builds and shares every `main` source with `full`, and
# nothing automated had ever exercised it on a device.
#
# A third leg was added when `minSdk` moved from 36 to 34: API 34 × `full`. The
# first two legs sit at the API *ceiling* we support, so until this leg existed
# the ~10k-line suite had never run at the floor at all — anything that breaks
# specifically at API 34 (resource resolution, startup, a platform behaviour
# difference) had nothing to surface it.
#
# What this leg does NOT buy, stated so nobody assumes otherwise: AppFunctions.
# Below API 36 the app publishes none — its entry point extends the platform
# service added in API 36 — and the only test that reaches the AppFunctions
# runtime, `AppFunctionsEndToEndTest`, is on the device-only exclusion list
# because Android 16 declares `EXECUTE_APP_FUNCTIONS` at `internal|privileged`
# and an emulator cannot grant it to a developer-installed app. The runtime
# remains covered by nothing automated, at any API level.
#
# The cost is named rather than papered over: **the app targets API 37 and no
# emulator run covers it.** That gap belongs to the manual reference-device
# pass until the action makes its unlock step optional.
#
# What this workflow deliberately does NOT do: cache the AVD between runs. The
# documented snapshot-cache dance trades a few minutes of boot time for a class
# of staleness bugs that surface as unexplained failures, and this workflow runs
# roughly once per phase on the pull-request path.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # 02:17 UTC — off the hour, where GitHub's scheduler is least contended.
    - cron: '17 2 * * *'
  workflow_dispatch:

# Deliberately keyed by event as well as ref: a push to `main` and the nightly
# schedule both run against `refs/heads/main`, and a merge landing mid-run would
# otherwise cancel the scheduled run whose whole purpose is to notice drift on a
# tree nobody pushed to.
concurrency:
  group: instrumented-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The classifier decides whether a red job means "the code is wrong" or "the
  # environment misbehaved", and whether to retry — but it only ever executes on
  # a failing run, so nothing else exercises it. Tested against a stub `gradlew`:
  # a couple of seconds, no device, no SDK. It gates the matrix rather than
  # running inside it, so a broken classifier fails once instead of per leg.
  classifier:
    name: Self-test the failure classifier
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Run the self-test
        run: bash .github/scripts/run-instrumented-selftest.sh

  instrumented:
    name: ${{ matrix.flavour }} · API ${{ matrix.api }}
    needs: classifier
    runs-on: ubuntu-latest
    # Sized for the worst realistic path, not the median: a cold Gradle build
    # (~15 min), an emulator boot (~8 min), the suite (~15 min) and one retried
    # attempt after an infrastructure failure. A timeout that trips mid-suite
    # produces a red job with no test report, which is the least useful outcome
    # available.
    timeout-minutes: 75
    env:
      # Declared once for the whole job: the script writes here, the summary
      # step reads the failure class from here, and the artifact upload takes
      # this path. Repeating the literal in three places is how one of them
      # silently stops matching and the summary starts reporting "unknown".
      LOG_DIR: build/instrumented-logs
    strategy:
      # One leg's failure must not hide the other's: an API-specific regression
      # is precisely what the matrix exists to surface.
      fail-fast: false
      matrix:
        include:
          - flavour: Full
            api: '36'
            target: google_apis
          - flavour: Foss
            api: '36'
            target: google_apis
          # The floor leg. `minSdk` is 34, and until this leg existed nothing
          # automated ran there — the suite only ever saw API 36, which is the
          # ceiling of what we support, not the edge where things break.
          # It buys the whole suite at the floor; it does NOT buy AppFunctions
          # (see the header note — the app publishes none below API 36, and the
          # only test that reaches the runtime is excluded from emulator runs). `full` rather than `foss` because the
          # flavour axis is already covered at 36 and the two share every
          # measured source.
          - flavour: Full
            api: '34'
            target: google_apis
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          # Only platform-tools. The action's default also asks for the legacy
          # `tools` package (SDK Tools 26), which nothing in this build uses and
          # which sdkmanager intermittently fails to resolve ("Failed to find
          # package 'tools'") — it broke the release job twice in a row.
          packages: 'platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          # Never write the shared cache from here. `check.yml`'s push-to-`main`
          # job owns it; a second writer whose build graph differs would evict
          # entries the merge gate depends on.
          cache-read-only: true

      # Without this the emulator falls back to software virtualisation and the
      # suite takes multiples of its normal wall-clock, usually long enough to
      # trip the job timeout.
      - name: Enable KVM
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the instrumented suite
        # Pinned to the commit behind v2.38.0 rather than the moving `v2` tag.
        # A mutable ref would let the same commit of this repository behave
        # differently from one day to the next, which is exactly the property
        # this project refuses to accept in anything that can fail a build.
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          GRADLE_TASK: ':app:connected${{ matrix.flavour }}DebugAndroidTest'
          # The instrumented exclusion list. Classes carrying this annotation
          # cannot reach a verdict on an emulator; the roster and the reason for
          # each entry are pinned by `InstrumentedTestExclusionGuardTest`.
          EXCLUDE_ANNOTATION: app.knotwork.android.testing.DeviceOnlyInstrumentedTest
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: x86_64
          profile: pixel_6
          cores: 4
          ram-size: 4096M
          # Not a round number picked for comfort. The debug APK is ~210 MB
          # because `abiFilters` strips non-arm64 only in `release`, so the debug
          # build packages all four ABIs; with the test APK and the probe on top,
          # the default AVD userdata partition runs out while adb is still
          # pushing. That is not hypothetical — it is what "write failed: No space
          # left on device" killed the API 36.1 leg with, twice, on the run that
          # was meant to confirm the leg worked. API 36 happened to fit, which is
          # luck rather than headroom, so the size is set for both.
          disk-size: 10G
          disable-animations: true
          # Compose text-field assertions are a documented flake source when the
          # spell checker underlines input mid-assertion.
          disable-spellchecker: true
          emulator-boot-timeout: 900
          force-avd-creation: true
          script: bash .github/scripts/run-instrumented.sh

      # Runs whatever the outcome, because the interesting case is the failed
      # one: it turns the exit code the script chose into a line a human reads.
      - name: Report the failure class
        if: ${{ !cancelled() }}
        env:
          LEG: ${{ matrix.flavour }} · API ${{ matrix.api }}
        run: |
          set -euo pipefail
          class="$(cat "$LOG_DIR/failure-class.txt" 2>/dev/null || echo unknown)"
          {
            echo "### Instrumented — $LEG"
            echo
            case "$class" in
              none)
                echo "Passed."
                ;;
              repo)
                echo "**Failure in the repository, not the environment.** Gradle failed on"
                echo "something other than a known environment signature — a failing"
                echo "assertion, or a build error in the instrumented sources. Deliberately"
                echo "not retried, so re-running the job will not change the outcome. The"
                echo "log is attached to this run, and the test report too if the suite got"
                echo "far enough to produce one."
                ;;
              infra)
                echo "**Infrastructure failure.** The run matched a known environment"
                echo "signature (lost device, failed install, dependency download) rather"
                echo "than a test assertion, twice in a row. Usually flakiness — re-run"
                echo "the job. But read the signature in the log first: one that names"
                echo "something the repository controls, such as a dependency that cannot"
                echo "resolve, failing twice is a repository problem, not flakiness."
                ;;
              *)
                echo "**Failed before the suite could classify itself.** The emulator did"
                echo "not reach the point of running Gradle — most often a boot timeout or"
                echo "a system-image download. Treat as an infrastructure failure and"
                echo "re-run; if it repeats, the image or the runner image has moved."
                ;;
            esac
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload instrumented test report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: instrumented-report-${{ matrix.flavour }}-api${{ matrix.api }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: ignore

      # The Gradle log, the logcat dump and the recorded failure class. On an
      # infrastructure failure these are the only evidence there is — the test
      # report may not exist at all.
      - name: Upload run logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: instrumented-logs-${{ matrix.flavour }}-api${{ matrix.api }}
          path: ${{ env.LOG_DIR }}/
          if-no-files-found: ignore

  # ── The one status check to require in branch protection ────────────────────
  #
  # Branch protection lives in GitHub's settings, not in this repository, so the
  # list of required check names is a hand-maintained copy of the job names in
  # this file with nothing to keep the two in step. Requiring the matrix legs by
  # name means: add a leg and it is silently not required; rename one and the
  # stale name blocks every pull request forever, waiting for a status that can
  # no longer be reported. Requiring this single job instead leaves the matrix
  # free to change.
  #
  # Require exactly two checks on `main`: `./gradlew check` and `Instrumented
  # gate`. Nothing else here needs naming: this job demands success from every
  # `needs`, and a failed classifier leaves the matrix `skipped`, which fails the
  # gate too. A job added to this workflow later must be added to `needs` or the
  # gate will not speak for it.
  gate:
    name: Instrumented gate
    needs: [classifier, instrumented]
    # `always()` is load-bearing, not defensive tidiness. A job skipped by a
    # conditional is reported to branch protection as SUCCESS — so without this,
    # a failing matrix would skip the gate and the required check would go green
    # at precisely the moment the tests were red. With `always()` the job runs
    # and decides for itself.
    #
    # Deliberate consequence: a run cancelled part-way leaves this red rather
    # than green. A cancelled run is not a passed run, and erring the other way
    # is how a required check comes to mean nothing.
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every leg to have passed
        env:
          CLASSIFIER: ${{ needs.classifier.result }}
          MATRIX: ${{ needs.instrumented.result }}
        run: |
          set -euo pipefail
          echo "classifier=$CLASSIFIER  matrix=$MATRIX"
          # `success` only when EVERY matrix leg succeeded; a failed classifier
          # leaves the matrix `skipped`, which is a failure here rather than an
          # absence of news.
          if [[ "$CLASSIFIER" == "success" && "$MATRIX" == "success" ]]; then
            echo "Every instrumented leg passed." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "::error title=Instrumented gate::classifier=$CLASSIFIER, matrix=$MATRIX — at least one instrumented leg did not pass. The per-leg jobs carry the diagnosis and the artifacts."
          exit 1
