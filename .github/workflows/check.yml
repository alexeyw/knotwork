name: Check

# Strict-mode CI gate.
# Runs the aggregate `./gradlew check` task, which itself triggers detekt,
# ktlintCheck, lint, the unit tests for both distribution flavours
# (testFullDebugUnitTest + testFossDebugUnitTest), koverVerifyFullDebug,
# verifyBrowserEditorConstants, and the project-level `checkNoInternalFqn`.
# `:buildSrc:test` is added explicitly because the build-logic module's own
# unit tests (e.g. the browser-editor constants generator) are not reachable
# from the app's `check` aggregate and would otherwise drift unnoticed.
# Compiling the instrumented source set is added for the same reason: `check`
# does not compile it either, so a broken instrumented test would leave every
# gate green. The instrumented tests are *run* by the separate `Instrumented`
# workflow, which stays out of this one so that an emulator cannot block a
# signed release (see the header of `instrumented.yml`).
# Any one of them failing blocks the merge.
#
# Triggers: every pull request targeting `main`, and every push to `main`
# (so the badge reflects the head of the protected branch). `workflow_dispatch`
# allows a manual run from the Actions tab — useful to exercise the gate on a
# phase branch before the phase→main PR exists. `workflow_call` lets
# `release.yml` reuse this exact gate as its first job instead of restating it:
# the release build must never run against a definition of "green" that has
# drifted from the one every pull request is measured by.
#
# What this gate deliberately does NOT decide: whether the project's
# dependencies are up to date. Those lint checks answer from an external version
# index, so their verdict changes without the repository changing; they run at
# informational severity and surface as the "Dependency version drift" job
# summary plus the always-uploaded lint report, never as a failure.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

# NOTE for callers: in a reusable workflow these expressions are evaluated in
# the CALLER's context, so `github.workflow` resolves to the calling workflow's
# name. A caller whose own top-level concurrency group would render to the same
# string (case-insensitively) deadlocks against itself — the caller run holds
# the group while this job waits for it. `release.yml` therefore uses a group
# name that cannot collide with `<caller name>-<ref>`.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ./gradlew check
    runs-on: ubuntu-latest
    # The `distribution` flavour dimension makes `check` compile and test two
    # variants (`full` + `foss`) in one invocation. On a PR the Gradle cache is
    # read-only and seeded from `main`, so the first run after a cache-key change
    # (e.g. when the FOSS flavour first reaches `main`) builds the whole `foss`
    # variant cold on the 2-core runner — which overran the previous 30-minute
    # cap. The push-to-`main` job (same cap) must also finish cold to *write* the
    # warm cache that makes subsequent PRs fast again, so the budget has to cover
    # one cold doubled-flavour build, not the warm steady state.
    #
    # Raised 60 → 75 when the instrumented-compile step was added: the previous
    # cap had already been forced up once by a cold doubled-flavour build that
    # overran it, and adding work to a job whose budget is tuned to its worst
    # case is how that happens again. A timeout kills the run outright and
    # produces no reports; a cap that is never reached costs nothing.
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        # Installs a current cmdline-tools and accepts the SDK licenses. The
        # API 37 platform (`compileSdk = release(37)`) and the matching
        # build-tools are then fetched automatically by AGP during the build
        # (`android.builder.sdkDownload` is on by default), so the exact
        # package coordinates do not have to be hand-maintained here.
        uses: android-actions/setup-android@v4
        with:
          # Only platform-tools. The action's default also asks for the legacy
          # `tools` package (SDK Tools 26), which nothing in this build uses and
          # which sdkmanager intermittently fails to resolve ("Failed to find
          # package 'tools'") — it broke the release job twice in a row.
          packages: 'platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Run ./gradlew check
        run: ./gradlew check :buildSrc:test --stacktrace --no-daemon

      # `check` neither runs NOR COMPILES the instrumented source set, so an
      # instrumented test could stop compiling and every gate would stay green —
      # which is how a whole `androidTest` source set once drifted out of
      # buildability unnoticed. Compiling it here closes that hole for the
      # merge gate and, because `release.yml` reuses this workflow, for the
      # release path too. Whether those tests *pass* is decided by the separate
      # `Instrumented` workflow; whether they *compile* is a pure function of
      # the repository, so it belongs in the deterministic gate.
      #
      # Its OWN Gradle invocation on purpose: bundling
      # `compile*DebugAndroidTestKotlin` into the same invocation as `check`
      # makes dozens of unrelated Robolectric unit tests fail with
      # "Default FirebaseApp is not initialized in this process". Run
      # separately, both are green.
      #
      # `!cancelled()` rather than the default: otherwise a lint or unit-test
      # failure hides an instrumented compile break for a whole extra CI cycle.
      - name: Compile the instrumented test sources
        if: ${{ !cancelled() }}
        run: >
          ./gradlew
          :app:compileFullDebugAndroidTestKotlin
          :app:compileFossDebugAndroidTestKotlin
          --stacktrace --no-daemon

      # Renders this run's informational lint findings into the job summary, so
      # the answer to "what is out of date?" is readable without downloading the
      # lint-report artifact below. Selects by SEVERITY rather than by a list of
      # issue ids on purpose: the demoted set is declared once, in buildSrc's
      # LintBaselineGuard, and a step that re-listed those ids here would be a
      # fourth copy to keep in sync. Reads the lint XML of every module; never
      # fails the job.
      - name: Summarise informational lint findings
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import glob
          import xml.etree.ElementTree as ET

          # Lint's own baseline bookkeeping notices are informational too, and are
          # noise here rather than findings.
          META_IDS = ("LintBaseline", "LintBaselineFixed")
          INFORMATIONAL = ("Hint", "Information", "Informational")

          reports = sorted(glob.glob("*/build/reports/lint-results-*.xml"))
          rows = set()
          for path in reports:
              try:
                  root = ET.parse(path).getroot()
              except Exception:
                  continue
              for issue in root.iter("issue"):
                  issue_id = issue.get("id") or ""
                  if issue.get("severity") not in INFORMATIONAL or issue_id in META_IDS:
                      continue
                  message = (issue.get("message") or "").replace("|", "\\|")
                  rows.add((issue_id, message))

          print("### Informational lint findings")
          print()
          print("These never fail the build: their verdict depends on an external version")
          print("index or on the calendar, not on the contents of the repository.")
          print("Dependencies are updated deliberately, not because a check went red.")
          print()
          if not reports:
              print("No lint reports were produced by this run.")
          elif rows:
              print("| Check | Finding |")
              print("| --- | --- |")
              for issue_id, message in sorted(rows):
                  print("| `%s` | %s |" % (issue_id, message))
          else:
              print("No informational findings in %d lint report(s)." % len(reports))
          PY

      - name: Upload detekt report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: detekt-report
          path: app/build/reports/detekt/
          if-no-files-found: ignore

      - name: Upload ktlint report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ktlint-report
          path: app/build/reports/ktlint/
          if-no-files-found: ignore

      # Uploaded on EVERY run, not only on failure. The version-freshness checks
      # report at informational severity (the demoted set is declared in buildSrc's
      # `LintBaselineGuard`), so a green run is exactly the run whose report
      # carries the dependency drift. Gating
      # this upload on failure would delete the signal the demotion was meant to
      # preserve. `:catalog` is included because the root `check` lints it too.
      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: |
            app/build/reports/lint-results-fullDebug.html
            app/build/reports/lint-results-fullDebug.xml
            app/build/reports/lint-results-fossDebug.html
            app/build/reports/lint-results-fossDebug.xml
            catalog/build/reports/lint-results-debug.html
            catalog/build/reports/lint-results-debug.xml
          if-no-files-found: ignore

      - name: Upload Kover coverage report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kover-report
          path: app/build/reports/kover/
          if-no-files-found: ignore

      - name: Upload Roborazzi diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: roborazzi-report
          path: |
            catalog/build/outputs/roborazzi/
            catalog/build/reports/roborazzi/
          if-no-files-found: ignore

      - name: Upload unit-test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests/
          if-no-files-found: ignore
