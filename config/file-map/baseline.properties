# Documentation ratchet for the generated FILE_MAP.md blocks.
#
# `<block>.undescribed` — entries rendered with the "no description" marker.
# `<block>.no-kdoc-seed` — Kotlin files offering no unambiguous KDoc sentence to
#                        seed a description from. A superset of "has no KDoc":
#                        a file documenting several unrelated declarations counts too.
#
# `./gradlew :app:generateFileMap` lowers these numbers and never raises one.
# Raising a number is a deliberate edit here, reviewed like any other change.
# `:app:verifyFileMap` fails when a measured count exceeds its recorded value.
app-android-test.no-kdoc-seed=7
app-android-test.undescribed=0
app-main.no-kdoc-seed=27
app-main.undescribed=0
app-source-sets.no-kdoc-seed=0
app-source-sets.undescribed=0
app-test.no-kdoc-seed=69
app-test.undescribed=0
catalog-test.no-kdoc-seed=5
catalog-test.undescribed=0
catalog.no-kdoc-seed=32
catalog.undescribed=0
