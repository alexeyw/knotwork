[versions]
agp = "9.4.1"
# Not a dependency: the NDK whose `llvm-strip` strips the prebuilt native libraries
# of a release build (`android.ndkVersion`). Pinned so the stripped bytes are a
# property of the repository, not of the host; a release build fails without it
# installed. `.github/workflows/release.yml` installs the version read from here.
# 28.2.13676358 is AGP 9.3.1's own default, i.e. what 0.10.1 was stripped with,
# and still AGP 9.4.1's (read from the plugin jar).
ndk = "28.2.13676358"
coreKtx = "1.19.1"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
lifecycleRuntimeKtx = "2.11.0"
activityCompose = "1.13.0"
kotlin = "2.4.20"
composeBom = "2026.09.00"
hilt = "2.60.1"
ksp = "2.3.12"
coroutines = "1.11.0"
serialization = "1.11.0"
timber = "5.0.1"
room = "2.8.5"
datastore = "1.2.1"
mockk = "1.14.11"
litertlm = "0.17.1"
mediapipe = "1.0.0"
# Not a direct dependency: a floor under MediaPipe's own protobuf-javalite (4.26.1
# in tasks-core 1.0.0), which sits inside CVE-2024-7254. Applied as a constraint in
# app/build.gradle.kts; drop it once MediaPipe itself requires >= 4.27.5.
protobufJavalite = "4.27.5"
navigationCompose = "2.10.2"
hiltNavigationCompose = "1.4.0"
okhttp = "5.5.0"
koog = "1.3.0"
# Google / DeepSeek prompt-executor clients and the MCP client module have
# not promoted past `1.3.0-beta` on Maven Central yet (the rest of
# Koog 1.3.0 is stable; checked 25.09.2026). Pin them separately so a single
# `koog` bump doesn't fail to resolve. Re-collapse onto `koog` once these three
# artifacts ship their stable release.
koog-preview = "1.3.0-beta"
# `appfunctions-service` ended at alpha09: from alpha10 its classes live in
# `appfunctions` (package `androidx.appfunctions`) and every function is declared in a
# service annotated `@AppFunctionServiceEntryPoint`. There is no third artifact to keep
# in step any more.
appfunctions = "1.0.0-alpha12"
markdown-renderer = "0.45.0"
work = "2.12.0"
hiltWork = "1.4.0"
gson = "2.14.0"
json = "20260814"
sqlcipher = "4.19.0"
detekt = "2.0.0-alpha.6"
ktlint = "14.2.0"
kover = "0.9.9"
firebaseBom = "34.19.0"
googleServices = "4.5.0"
crashlyticsPlugin = "3.0.8"
coreSplashscreen = "1.2.0"
roborazzi = "1.75.0"
robolectric = "4.17"
processPhoenix = "3.0.0"
coil = "3.6.3"
exifinterface = "1.4.2"
konsist = "0.17.3"

[libraries]
androidx-compose-material-icons-core = { module = "androidx.compose.material:material-icons-core" }
androidx-compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended" }
json = { group = "org.json", name = "json", version.ref = "json" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
mockk = { group = "io.mockk", name = "mockk", version.ref = "mockk" }
mockk-android = { group = "io.mockk", name = "mockk-android", version.ref = "mockk" }
litertlm = { group = "com.google.ai.edge.litertlm", name = "litertlm-android", version.ref = "litertlm" }
mediapipe-tasks-text = { group = "com.google.mediapipe", name = "tasks-text", version.ref = "mediapipe" }
protobuf-javalite = { group = "com.google.protobuf", name = "protobuf-javalite", version.ref = "protobufJavalite" }
coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
androidx-hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "hiltNavigationCompose" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
okhttp-mockwebserver3 = { group = "com.squareup.okhttp3", name = "mockwebserver3", version.ref = "okhttp" }
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hilt" }
coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization" }
coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
timber = { group = "com.jakewharton.timber", name = "timber", version.ref = "timber" }
room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
room-testing = { group = "androidx.room", name = "room-testing", version.ref = "room" }
datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
koog-agents = { group = "ai.koog", name = "koog-agents", version.ref = "koog" }
# `agents-mcp` carries the client-side `McpToolRegistryProvider` /
# `mcpStreamableHttpTransport` the codebase uses. The previous `agents-mcp-server`
# entry was a misnomer that happened to work in 0.8.0 because the server
# artifact transitively pulled the client; 1.0.0+ split them, so we now name
# the client artifact directly.
koog-mcp = { group = "ai.koog", name = "agents-mcp", version.ref = "koog-preview" }
koog-openai = { group = "ai.koog", name = "prompt-executor-openai-client", version.ref = "koog" }
koog-anthropic = { group = "ai.koog", name = "prompt-executor-anthropic-client", version.ref = "koog" }
koog-google = { group = "ai.koog", name = "prompt-executor-google-client", version.ref = "koog-preview" }
koog-deepseek = { group = "ai.koog", name = "prompt-executor-deepseek-client", version.ref = "koog-preview" }
koog-ollama = { group = "ai.koog", name = "prompt-executor-ollama-client", version.ref = "koog" }
# Runtime HTTP factory provider — Koog 1.0.0 split the HTTP client into an SPI
# (`KoogHttpClient.Factory`) that has to be present on the runtime classpath
# for every prompt-executor to instantiate. Without it the executors throw
# `IllegalStateException: No KoogHttpClient.Factory provider found on the
# runtime classpath.` on the first call. The Ktor-backed provider is the
# canonical default.
koog-http-client-ktor = { group = "ai.koog", name = "http-client-ktor", version.ref = "koog" }
androidx-appfunctions = { group = "androidx.appfunctions", name = "appfunctions", version.ref = "appfunctions" }
androidx-appfunctions-compiler = { group = "androidx.appfunctions", name = "appfunctions-compiler", version.ref = "appfunctions" }
markdown-m3 = { group = "com.mikepenz", name = "multiplatform-markdown-renderer-m3", version.ref = "markdown-renderer" }
androidx-work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "work" }
androidx-hilt-work = { group = "androidx.hilt", name = "hilt-work", version.ref = "hiltWork" }
androidx-hilt-compiler = { group = "androidx.hilt", name = "hilt-compiler", version.ref = "hiltWork" }
work-testing = { group = "androidx.work", name = "work-testing", version.ref = "work" }
gson = { group = "com.google.code.gson", name = "gson", version.ref = "gson" }
sqlcipher-android = { group = "net.zetetic", name = "sqlcipher-android", version.ref = "sqlcipher" }
firebase-bom = { group = "com.google.firebase", name = "firebase-bom", version.ref = "firebaseBom" }
firebase-crashlytics = { group = "com.google.firebase", name = "firebase-crashlytics" }
androidx-core-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "coreSplashscreen" }
roborazzi = { group = "io.github.takahirom.roborazzi", name = "roborazzi", version.ref = "roborazzi" }
roborazzi-compose = { group = "io.github.takahirom.roborazzi", name = "roborazzi-compose", version.ref = "roborazzi" }
roborazzi-junit-rule = { group = "io.github.takahirom.roborazzi", name = "roborazzi-junit-rule", version.ref = "roborazzi" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
process-phoenix = { group = "com.jakewharton", name = "process-phoenix", version.ref = "processPhoenix" }
coil-compose = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil" }
androidx-exifinterface = { group = "androidx.exifinterface", name = "exifinterface", version.ref = "exifinterface" }
konsist = { group = "com.lemonappdev", name = "konsist", version.ref = "konsist" }

