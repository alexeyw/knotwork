# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Heap for the Gradle daemon. `./gradlew check :buildSrc:test` runs lint,
# detekt with type resolution, ktlint and the Kover reports inside this one
# JVM, a release build R8 as well, and a daemon kept across builds outgrew
# 2 GiB: it stopped with "the JVM garbage collector is thrashing" on the 9th
# `check` in a row (in `:catalog:detekt`) and on a release build after six of
# them (in R8 and `lintVitalAnalyze`). At 3 GiB, the first two `check` runs of
# a daemon already needed 21 full collections and kept up to 2.7 GiB live
# after one, so the daemon gets 4 GiB.
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
# Dedicated heap for the Kotlin compile daemon. The `distribution` product
# flavour dimension makes `./gradlew check` compile multiple variants (`full` +
# `foss`, debug + release) in one invocation. A local incremental build only
# recompiles changed files, so peak heap stays low; but a cold build (CI, where
# the cache is read-only and seeded from `main`) compiles every source file of
# the whole module from scratch in one task, and the codegen back-end then
# overran a 2 GiB heap with `OutOfMemoryError: Java heap space`. 4 GiB covers
# the cold full-module compile and still leaves room beside the 4 GiB Gradle
# daemon on the 16 GB GitHub-hosted runner (compile finishes before the test
# JVMs fork, so the peaks do not overlap).
kotlin.daemon.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=512m
# Reuse task outputs across builds (local and the setup-gradle CI cache). This
# helps the doubled `full` + `foss` workload by reusing shared upstream task
# outputs (e.g. the `:catalog` compilation both variants depend on) instead of
# recomputing them per variant and per run.
org.gradle.caching=true
# Parallel mode is intentionally left OFF: the `distribution` flavour dimension
# already doubles the compile workload, and overlapping module compiles would
# raise peak memory on top of the 4 GiB Gradle daemon, the 4 GiB Kotlin daemon
# and a 2 GiB test JVM that already share the 16 GB GitHub-hosted runner
# (on the 7 GiB runner of the time, the doubled workload was already at the
# edge of "Not enough memory to run compilation").
# org.gradle.parallel=true
# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official
# Enables namespacing of each library's R class so that its R class includes only the
# resources declared in the library itself and none from the library's dependencies,
# thereby reducing the size of the R class for that library
android.nonTransitiveRClass=true
android.disallowKotlinSourceSets=false
