                position: { x: internal.pos_x, y: internal.pos_y },
                label: cfg.title,
                config: {
                    systemPrompt: flat.systemPrompt || null,
                    cloudProvider: flat.cloudProvider || null,
                    modelPath: flat.modelPath || null,
                    toolName: flat.toolName || null,
                    // PIPELINE / SKILL reference ids — the runtime executors read
                    // these flat fields, so they must travel in `config` (the rich
                    // nodeConfig envelope carries them too). Matches Android
                    // PipelineJsonSerializer.serializeNode.
                    targetPipelineId: flat.targetPipelineId || null,
                    skillId: flat.skillId || null,
                    // TOOL / SKILL "always ask": the gate reads the flat field, and
                    // the app's importer does not derive it from nodeConfig — left
                    // out, the switch showed ticked in the app and asked nothing.
                    alwaysConfirm: flat.alwaysConfirm === true ? true : null,
                    clarificationTimeoutMs: flat.clarificationTimeoutMs ?? null,
                    conditionPrompt: flat.conditionPrompt || null,
                    conditionKeywords: flat.conditionKeywords || null,
                    conditionComplexity: flat.conditionComplexity ?? null,
                    // Router fallback, sub-task cap and clarification replies: the
                    // app runs these from `config` and its node sheet shows them from
                    // there too, so left out they were browser settings lost on import.
                    fallbackClass: flat.fallbackClass || null,
                    maxSubtasks: flat.maxSubtasks ?? null,
                    quickReplies: flat.quickReplies || null,
                    // Queue "stop on first error" and the condition's image check:
                    // the app reads both from here only, so left out they came
                    // back at their defaults however the form was set.
                    stopOnError: flat.stopOnError ?? null,
                    conditionHasImage: flat.conditionHasImage ?? null,
                },
                contextConfig: Object.assign(
                    { chatHistory: true, originalTask: true, nodeInput: true, longTermMemory: true, toolResults: true },
                    fullData.contextConfig || {},
                ),
                nodeConfig: encodeRichEnvelope(n.type, cfg),
            };
        });

        const jsonConnections = [];
        nodes.forEach(n => {
            Object.entries(n.outputs).forEach(([outClass, outDesc]) => {
                (outDesc.connections || []).forEach(c => {
                    const inClass = c.output; // drawflow names the target's input class `output` here
                    const labelKey = connectionKey(n.id, outClass, String(c.node), inClass);
                    jsonConnections.push({
                        id: 'conn-' + n.id + '-' + outClass + '-' + c.node + '-' + inClass,
                        fromNodeId: 'node-' + n.id,
                        toNodeId: 'node-' + c.node,
                        label: connectionLabels.get(labelKey) || null,
                    });
                });
            });
        });

        const doc = {
            schemaVersion: CURRENT_SCHEMA_VERSION,
            id: currentPipelineId,
            name: (nameInput.value || '').trim() || 'Untitled pipeline',
            updatedAt: Date.now(),
            nodes: jsonNodes,
            connections: jsonConnections,
        };
        // Optional pipeline-level field: the long-term-memory search key used by
        // background runs (trigger / scheduled / tile). Omitted entirely when
        // empty, so pipelines that do not declare one export exactly as before.
        const memoryQuery = (memoryQueryInput.value || '').trim();
        if (memoryQuery) doc.memoryRetrievalQuery = memoryQuery;
        return doc;
    }

    /** Today's date as YYYY-MM-DD, used in default download filenames. */
    function todayStamp() {
        return new Date().toISOString().slice(0, 10);
    }

    /** Downloads [obj] as pretty-printed JSON under [filename] (single download primitive). */
    function downloadJson(obj, filename) {
        const blob = new Blob([JSON.stringify(obj, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    }

    exportBtn.addEventListener('click', () => {
        if (validateGraph().errors.length > 0) return;
        downloadJson(exportToJson(), `pipeline-${todayStamp()}.json`);
    });

    /* -------------------------------------------------------------------- *
     *  Import
     * -------------------------------------------------------------------- */
    importBtn.addEventListener('click', () => fileImportInput.click());
    fileImportInput.addEventListener('change', e => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;
        // Reset so re-selecting the same file fires `change` again
        fileImportInput.value = '';
        const reader = new FileReader();
        reader.onload = () => {
            try {
                importFromJson(JSON.parse(reader.result));
            } catch (err) {
                alert('Failed to parse JSON: ' + err.message);
            }
        };
        reader.onerror = () => alert('Failed to read file.');
        reader.readAsText(file);
    });

    /**
     * Tells the connectionCreated auto-label seed to stand down while we
     * rebuild the graph from JSON — labels in the document are
     * authoritative.
     */
    let suppressAutoLabel = false;

    function importFromJson(doc) {
        // Validate structure BEFORE touching the canvas — clearing the
        // current graph and then crashing partway through the rebuild
        // would silently destroy the user's work for a malformed file.
        if (!doc || typeof doc !== 'object' || Array.isArray(doc)) {
            alert('File does not contain a valid JSON document.');
            return;
        }
        if (doc.nodes != null && !Array.isArray(doc.nodes)) {
            alert('Invalid pipeline document: "nodes" must be an array.');
            return;
        }
        if (doc.connections != null && !Array.isArray(doc.connections)) {
            alert('Invalid pipeline document: "connections" must be an array.');
            return;
        }
        const rawNodes = doc.nodes || [];
        const rawConnections = doc.connections || [];
        for (let i = 0; i < rawNodes.length; i++) {
            const jn = rawNodes[i];
            if (!jn || typeof jn !== 'object' || Array.isArray(jn)) {
                alert(`Invalid pipeline document: nodes[${i}] is not an object.`);
                return;
            }
            if (typeof jn.id !== 'string' || !jn.id) {
                alert(`Invalid pipeline document: nodes[${i}].id is missing.`);
                return;
            }
            if (typeof jn.type !== 'string' || !NODE_TYPE_BY_ID[jn.type]) {
                alert(`Invalid pipeline document: nodes[${i}] has unknown type "${jn.type}".`);
                return;
            }
        }
        for (let i = 0; i < rawConnections.length; i++) {
            const jc = rawConnections[i];
            if (!jc || typeof jc !== 'object' || Array.isArray(jc)) {
                alert(`Invalid pipeline document: connections[${i}] is not an object.`);
                return;
            }
        }

        if (doc.schemaVersion !== CURRENT_SCHEMA_VERSION) {
            const ok = confirm(
                `File was created by a different editor version ` +
                `(schemaVersion=${doc.schemaVersion}, expected ${CURRENT_SCHEMA_VERSION}). ` +
                `Some configuration may not round-trip cleanly. Continue?`,
            );
            if (!ok) return;
        }

        // Build a stripped numeric-id → seeded data map keyed by the JSON's
        // own ids. drawflow assigns its own integer ids on addNode, so we
        // cannot honour the JSON ids verbatim — instead we map JSON ids to
        // drawflow ids during the rebuild and use that map when wiring
        // connections.
        const idMap = new Map();
        suppressAutoLabel = true;
        try {
            // Wipe everything: graph, history, labels.
            editor.clear();
            connectionLabels.clear();

            rawNodes.forEach(jn => {
                const t = NODE_TYPE_BY_ID[jn.type];
                // The document's flat fields — the copy the app runs. Every field a
                // run reads is shown from these, with or without a nodeConfig
                // envelope (deriveRichFromFlat / decodeRichEnvelope).
                const flatIn = {
                    label: jn.label || t.label,
                    systemPrompt: jn.config?.systemPrompt || '',
                    cloudProvider: jn.config?.cloudProvider || (jn.type === 'CLOUD' ? 'auto' : ''),
                    modelPath: jn.config?.modelPath || '',
                    toolName: jn.config?.toolName || '',
                    targetPipelineId: jn.config?.targetPipelineId || '',
                    skillId: jn.config?.skillId || '',
                    alwaysConfirm: wireBool(jn.config?.alwaysConfirm) === true,
                    clarificationTimeoutMs: jn.config?.clarificationTimeoutMs ?? null,
                    conditionPrompt: jn.config?.conditionPrompt || '',
                    conditionKeywords: jn.config?.conditionKeywords || '',
                    conditionComplexity: jn.config?.conditionComplexity ?? null,
                    conditionHasImage: wireBool(jn.config?.conditionHasImage),
                    // Left undefined when the key is absent, not null: that is how
                    // decodeRichEnvelope recognises a file from an editor that kept
                    // these four only in the envelope.
                    fallbackClass: jn.config?.fallbackClass,
                    maxSubtasks: jn.config?.maxSubtasks,
                    quickReplies: jn.config?.quickReplies,
                    stopOnError: jn.config?.stopOnError === undefined ? undefined : wireBool(jn.config.stopOnError),
                };
                // Legacy intentRouterPrompt: early editors stored a router's prompt
                // under this key. Folded for INTENT_ROUTER only, like the other keys
                // older editors kept elsewhere (decodeRichEnvelope); the app does not
                // read it, and no other node type ever wrote it.
                if (jn.type === 'INTENT_ROUTER' && jn.config?.intentRouterPrompt && !flatIn.systemPrompt) {
                    flatIn.systemPrompt = jn.config.intentRouterPrompt;
                }
                // The envelope adds only what no run reads (classes, retry count,
                // description, round-trip-only values); older exports and
                // hand-written documents have none.
                const cfg = (jn.nodeConfig && typeof jn.nodeConfig === 'object')
                    ? decodeRichEnvelope(jn.type, jn.nodeConfig, flatIn)
                    : deriveRichFromFlat(jn.type, flatIn);
                cfg.title = flatIn.label || cfg.title;
                // Re-derive the flat fields from cfg so the two never drift.
                const data = Object.assign(defaultNodeData(jn.type), richToFlat(jn.type, cfg), {
                    label: cfg.title,
                    cfg: cfg,
                    contextConfig: readContextConfig(jn.type, jn.contextConfig),
                });
                const dfId = editor.addNode(
                    t.id, t.inputs, t.outputs,
                    jn.position?.x ?? 0, jn.position?.y ?? 0,
                    'nodetype-' + t.id,
                    data,
                    nodeHtml(t),
                );
                idMap.set(jn.id, String(dfId));
                // Patch the visible label inside the just-rendered node.
                const labelEl = document.querySelector(`#node-${dfId} .node-body .label`);
                if (labelEl) labelEl.textContent = data.label || t.label;
            });

            rawConnections.forEach(jc => {
                const srcDf = idMap.get(jc.fromNodeId);
                const tgtDf = idMap.get(jc.toNodeId);
                if (!srcDf || !tgtDf) {
                    console.warn('Connection references unknown node:', jc);
                    return;
                }
                const srcType = editor.getNodeFromId(srcDf)?.name;
                const outClass = pickOutputClass(srcType, jc.label);
                const inClass = 'input_1';
                editor.addConnection(srcDf, tgtDf, outClass, inClass);
                if (jc.label) {
                    connectionLabels.set(connectionKey(srcDf, outClass, tgtDf, inClass), jc.label);
                }
            });

            // Restore pipeline-level identity & name from the file.
            currentPipelineId = doc.id || generateUuid();
            nameInput.value = doc.name || '';
            memoryQueryInput.value = typeof doc.memoryRetrievalQuery === 'string'
                ? doc.memoryRetrievalQuery
                : '';
        } finally {
            suppressAutoLabel = false;
        }

        redrawLabels();
        // The history stack belongs to the pre-import state — wipe it so the
        // user can't undo "into" an inconsistent half-imported snapshot.
        history = [];
        historyIndex = -1;
        pushSnapshot();
        runValidation();
    }

    /**
     * Picks which output socket a connection should attach to when
     * recreating it from JSON. For single-output types we always use
     * output_1; for multi-output types we honour the inline-port labels
     * (True/False, Item/Done, Pass/Retry/Fail) so the rebuilt graph
     * matches what the user exported.
     */
    function pickOutputClass(srcType, label) {
        if (srcType === 'IF_CONDITION') {
            if (label === 'False') return 'output_2';
            return 'output_1';
        }
        if (srcType === 'QUEUE_PROCESSOR') {
            if (label === 'Done') return 'output_2';
            return 'output_1';
        }
        if (srcType === 'EVALUATION') {
            if (label === 'Retry') return 'output_2';
            if (label === 'Fail') return 'output_3';
            return 'output_1';
        }
        return 'output_1';
    }

    /* ==================================================================== *
     *  Pipeline presets
     *
     *  A preset is a `.preset.json` document — a strict superset of the
     *  pipeline JSON owned by PipelineJsonSerializer, with three extra
     *  top-level fields (`category`, `tags`, `description`) mirroring
     *  domain/pipelineio/PipelinePresetJsonSerializer.kt. The "📚 Presets"
     *  modal exposes the bundled catalogue (BUILTIN_PIPELINE_PRESETS) and a
     *  per-browser "Mine" catalogue persisted in localStorage.
     * ==================================================================== */
    const PIPELINE_PRESETS_STORAGE_KEY = 'pipeline-editor-pipeline-presets';

    /**
     * Preset categories — mirror app.knotwork.android.domain.models.PresetCategory
     * (key = lower-case enum name). KEEP IN SYNC. See DESCRIPTION.md §8.2.
     */
    const PRESET_CATEGORIES = [
        { key: 'local',    label: 'Local' },
        { key: 'cloud',    label: 'Cloud' },
        { key: 'hybrid',   label: 'Hybrid' },
        { key: 'tool',     label: 'Tool' },
        { key: 'research', label: 'Research' },
        { key: 'other',    label: 'Other' },
    ];

    /** Decodes a category wire key to its label, falling back to "Other". */
    function presetCategoryLabel(key) {
        const found = PRESET_CATEGORIES.find(c => c.key === (key || 'other'));
        return found ? found.label : 'Other';
    }

    /**
     * Session fallback for browsers where localStorage is unavailable
     * (private mode, disabled storage, quota exceeded). `null` means
     * "localStorage is the source of truth"; once a write fails it holds the
     * live list so Save / Import / Delete stay usable for the rest of the
     * session instead of silently reverting to an empty Mine tab.
     */
    let userPipelinePresetsFallback = null;

    /**
     * Per-browser, user-managed pipeline-preset catalogue. Reads from the
     * in-memory fallback once a write has failed this session; otherwise
     * from localStorage, degrading to an empty list if the read throws.
     */
    function loadUserPipelinePresets() {
        if (userPipelinePresetsFallback !== null) return userPipelinePresetsFallback;
        try {
            const raw = localStorage.getItem(PIPELINE_PRESETS_STORAGE_KEY);
            if (!raw) return [];
            const parsed = JSON.parse(raw);
            if (!Array.isArray(parsed)) return [];
            // Keep only documents that at least carry a nodes array — anything
            // else could not round-trip back onto the canvas.
            return parsed.filter(p => p && typeof p === 'object' && Array.isArray(p.nodes));
        } catch (_) {
            return [];
        }
    }

    function saveUserPipelinePresets(list) {
        try {
            localStorage.setItem(PIPELINE_PRESETS_STORAGE_KEY, JSON.stringify(list));
            // Write succeeded — localStorage is authoritative again.
            userPipelinePresetsFallback = null;
        } catch (_) {
            // Storage unavailable: keep the list in memory so the Mine tab and
            // subsequent loads reflect the action for this session.
            userPipelinePresetsFallback = list;
        }
    }

    /** Lower-case kebab slug used for preset ids and `.preset.json` filenames. */
    function slugifyPresetId(name) {
        const base = (name || '').toLowerCase().trim()
            .replace(/[^a-z0-9]+/g, '-')
            .replace(/^-+|-+$/g, '');
        return base || 'preset';
    }

    /**
     * Builds a `.preset.json` document from the current canvas. Reuses
     * exportToJson() for the graph half (so it stays in lock-step with the
     * pipeline schema) and layers the three preset-only fields on top.
     */
    function exportToPresetJson(meta) {
        const doc = exportToJson();
        if (meta && meta.name) doc.name = meta.name;
        doc.id = (meta && meta.id) || slugifyPresetId((meta && meta.name) || doc.name);
        doc.description = (meta && meta.description) || '';
        doc.category = (meta && meta.category) || 'other';
        doc.tags = (meta && Array.isArray(meta.tags)) ? meta.tags : [];
        return doc;
    }

    /** Downloads a preset document as `<id>.preset.json`. */
    function downloadPresetJson(doc) {
        downloadJson(doc, (doc.id || slugifyPresetId(doc.name)) + '.preset.json');
    }

    /**
     * Light structural validation for an imported `.preset.json` before it
     * is stored in the "Mine" catalogue. Mirrors the guards in
     * importFromJson so a malformed file is rejected cleanly instead of
     * surfacing later when the user tries to load it onto the canvas.
     */
    /**
     * Structural validation for a single pipeline document (shared by the
     * preset importer and the bundle importer). Returns an error string, or
     * null when the document is structurally sound.
     */
    function pipelineDocStructureError(doc) {
        if (!doc || typeof doc !== 'object' || Array.isArray(doc)) {
            return 'File does not contain a valid JSON document.';
        }
        if (doc.nodes != null && !Array.isArray(doc.nodes)) return '"nodes" must be an array.';
        if (doc.connections != null && !Array.isArray(doc.connections)) return '"connections" must be an array.';
        const nodes = doc.nodes || [];
        for (let i = 0; i < nodes.length; i++) {
            const n = nodes[i];
            if (!n || typeof n !== 'object' || Array.isArray(n)) return `nodes[${i}] is not an object.`;
            if (typeof n.id !== 'string' || !n.id) return `nodes[${i}].id is missing.`;
            if (typeof n.type !== 'string' || !NODE_TYPE_BY_ID[n.type]) {
                return `nodes[${i}] has unknown type "${n.type}".`;
            }
        }
        return null;
    }

    function parsePresetDoc(text) {
        let doc;
        try {
            doc = JSON.parse(text);
        } catch (e) {
            return { error: 'Failed to parse JSON: ' + e.message };
        }
        const structureError = pipelineDocStructureError(doc);
        if (structureError) return { error: structureError };
        return { doc };
    }

    /**
     * Shows the schema-version mismatch confirmation for an imported preset.
     * Returns true to proceed. (The canvas-load path relies on
     * importFromJson's own mismatch dialog instead, to avoid a double
     * prompt.)
     */
    function confirmPresetSchema(doc) {
        if (doc.schemaVersion === CURRENT_SCHEMA_VERSION) return true;
        const newer = typeof doc.schemaVersion === 'number' && doc.schemaVersion > CURRENT_SCHEMA_VERSION;
        return confirm(
            `This preset was created by a ${newer ? 'newer' : 'different'} editor version ` +
            `(schemaVersion=${doc.schemaVersion}, expected ${CURRENT_SCHEMA_VERSION}). ` +
            `Some configuration may not round-trip cleanly. Import anyway?`,
        );
    }

    /* ---- Modal wiring ---- */
    const presetDialog = document.getElementById('preset-library');
    const presetSaveDialog = document.getElementById('preset-save');
    const presetBtn = document.getElementById('btn-presets');
    const fileImportPresetInput = document.getElementById('file-import-preset');
    let presetActiveTab = 'bundled';

    /** Builds one preset card (name, category badge, description, tags, actions). */
    function renderPresetCard(doc, isMine, index) {
        const card = document.createElement('div');
        card.className = 'preset-card';

        const head = document.createElement('div');
        head.className = 'preset-card-head';
        const nameEl = document.createElement('span');
        nameEl.className = 'preset-card-name';
        nameEl.textContent = doc.name || 'Untitled preset';
        const badge = document.createElement('span');
        badge.className = 'preset-badge';
        badge.textContent = presetCategoryLabel(doc.category);
        head.appendChild(nameEl);
        head.appendChild(badge);
        card.appendChild(head);

        if (doc.description) {
            const desc = document.createElement('p');
            desc.className = 'preset-card-desc';
            desc.textContent = doc.description;
            card.appendChild(desc);
        }

        const tags = Array.isArray(doc.tags) ? doc.tags : [];
        if (tags.length) {
            const tagsRow = document.createElement('div');
            tagsRow.className = 'preset-tags';
            tags.forEach(tg => {
                const t = document.createElement('span');
                t.className = 'preset-tag';
                t.textContent = tg;
                tagsRow.appendChild(t);
            });
            card.appendChild(tagsRow);
        }

        const actions = document.createElement('div');
        actions.className = 'preset-card-actions';

        const loadBtn = document.createElement('button');
        loadBtn.type = 'button';
        loadBtn.className = 'primary';
        loadBtn.textContent = 'Load';
        loadBtn.addEventListener('click', () => loadPresetOntoCanvas(doc));
        actions.appendChild(loadBtn);

        const exportRowBtn = document.createElement('button');
        exportRowBtn.type = 'button';
        exportRowBtn.textContent = 'Export';
        exportRowBtn.addEventListener('click', () => downloadPresetJson(doc));
        actions.appendChild(exportRowBtn);

        if (isMine) {
            const delBtn = document.createElement('button');
            delBtn.type = 'button';
            delBtn.className = 'danger';
            delBtn.textContent = 'Delete';
            delBtn.addEventListener('click', () => deleteUserPreset(index));
            actions.appendChild(delBtn);
        }
        card.appendChild(actions);
        return card;
    }

    /** Re-renders the active tab's list and reflects the tab selection. */
    function renderPresetList() {
        presetDialog.querySelectorAll('.preset-tab').forEach(t => {
            t.classList.toggle('is-active', t.dataset.tab === presetActiveTab);
        });
        const list = presetDialog.querySelector('[data-role="list"]');
        list.innerHTML = '';
        const isMine = presetActiveTab === 'mine';
        // Internal presets are building blocks of a composed preset, not
        // catalogue entries — hidden here only, so PIPELINE targets and the
        // bundle-export closure keep resolving them.
        const items = isMine
            ? loadUserPipelinePresets()
            : BUILTIN_PIPELINE_PRESETS.filter(p => !p.internal);
        if (!items.length) {
            const empty = document.createElement('div');
            empty.className = 'preset-empty';
            empty.textContent = isMine
                ? 'No saved presets yet. Build a graph and tap "Save canvas as preset…", or import a .preset.json file.'
                : 'No bundled presets available.';
            list.appendChild(empty);
            return;
        }
        items.forEach((doc, index) => list.appendChild(renderPresetCard(doc, isMine, index)));
    }

    function openPresetLibrary() {
        renderPresetList();
        presetDialog.showModal();
    }

    /**
     * Instantiates a preset onto the canvas. We strip the `id` so
     * importFromJson mints a fresh pipeline id (mirroring how Android
     * regenerates ids when materialising a preset), then delegate to
     * importFromJson for the graph rebuild, name restore and schema-mismatch
     * dialog.
     */
    function loadPresetOntoCanvas(doc) {
        presetDialog.close();
        importFromJson(Object.assign({}, doc, { id: undefined }));
    }

    function deleteUserPreset(index) {
        const list = loadUserPipelinePresets();
        if (index < 0 || index >= list.length) return;
        const name = list[index].name || 'this preset';
        if (!confirm(`Delete preset "${name}"? This cannot be undone.`)) return;
        list.splice(index, 1);
        saveUserPipelinePresets(list);
        renderPresetList();
    }

    /* ---- Import preset → "Mine" (non-destructive; never touches canvas) ---- */
    fileImportPresetInput.addEventListener('change', e => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;
        fileImportPresetInput.value = '';
        const reader = new FileReader();
        reader.onload = () => {
            const res = parsePresetDoc(reader.result);
            if (res.error) {
                alert('Failed to import preset: ' + res.error);
                return;
            }
            if (!confirmPresetSchema(res.doc)) return;
            const list = loadUserPipelinePresets();
            list.unshift(Object.assign({}, res.doc, {
                id: res.doc.id || generateUuid(),
                savedAt: Date.now(),
            }));
            saveUserPipelinePresets(list);
            presetActiveTab = 'mine';
            renderPresetList();
        };
        reader.onerror = () => alert('Failed to read file.');
        reader.readAsText(file);
    });

    /* ---- Save canvas as preset ---- */
    function openSavePresetDialog() {
        if (validateGraph().errors.length > 0) {
            alert('Fix the validation errors before saving this graph as a preset.');
            return;
        }
        const sel = document.getElementById('preset-save-category');
        if (!sel.options.length) {
            PRESET_CATEGORIES.forEach(c => {
                const o = document.createElement('option');
                o.value = c.key;
                o.textContent = c.label;
                sel.appendChild(o);
            });
        }
        document.getElementById('preset-save-name').value = (nameInput.value || '').trim();
        document.getElementById('preset-save-tags').value = '';
        document.getElementById('preset-save-description').value = '';
        sel.value = 'other';
        const err = presetSaveDialog.querySelector('[data-role="error"]');
        err.hidden = true;
        err.textContent = '';
        presetSaveDialog.showModal();
    }

    function commitSavePreset() {
        const err = presetSaveDialog.querySelector('[data-role="error"]');
        const name = (document.getElementById('preset-save-name').value || '').trim();
        if (!name) {
            err.textContent = 'Name is required.';
            err.hidden = false;
            return;
        }
        // 60-char cap matches MAX_NAME_LENGTH in the Android save use-cases.
        if (name.length > 60) {
            err.textContent = 'Name must be 60 characters or fewer.';
            err.hidden = false;
            return;
        }
        const tags = (document.getElementById('preset-save-tags').value || '')
            .split(',').map(t => t.trim()).filter(Boolean);
        const doc = exportToPresetJson({
            id: generateUuid(),
            name,
            category: document.getElementById('preset-save-category').value || 'other',
            tags,
            description: (document.getElementById('preset-save-description').value || '').trim(),
        });
        const list = loadUserPipelinePresets();
        list.unshift(Object.assign({}, doc, { savedAt: Date.now() }));
        saveUserPipelinePresets(list);
        presetSaveDialog.close();
        presetActiveTab = 'mine';
        renderPresetList();
    }

    presetBtn.addEventListener('click', openPresetLibrary);
    presetDialog.querySelector('[data-role="close"]').addEventListener('click', () => presetDialog.close());
    presetDialog.querySelectorAll('.preset-tab').forEach(t => {
        t.addEventListener('click', () => {
            presetActiveTab = t.dataset.tab;
            renderPresetList();
        });
    });
    presetDialog.querySelector('[data-role="import"]').addEventListener('click', () => fileImportPresetInput.click());
    presetDialog.querySelector('[data-role="save-current"]').addEventListener('click', openSavePresetDialog);
    presetSaveDialog.querySelector('[data-role="cancel"]').addEventListener('click', () => presetSaveDialog.close());
    presetSaveDialog.querySelector('[data-role="confirm"]').addEventListener('click', commitSavePreset);

    /* ==================================================================== *
     *  Pipeline bundles — a root pipeline plus the transitive closure of its
     *  PIPELINE dependencies, in one self-contained file. Mirrors the Android
     *  PipelineBundleJsonSerializer envelope. KEEP IN SYNC (DESCRIPTION.md §8).
     * ==================================================================== */
    const CURRENT_BUNDLE_VERSION = 1;
    const MAX_BUNDLE_PIPELINES = 50;
    const exportBundleBtn = document.getElementById('btn-export-bundle');
    const importBundleBtn = document.getElementById('btn-import-bundle');
    const fileImportBundleInput = document.getElementById('file-import-bundle');

    /**
     * The one resolver of a PIPELINE target id: Bundled + Mine presets by id,
     * with a **bundled** preset winning over a Mine document that reuses its id.
     * The picker and the bundle export both read this map. They used to resolve
     * the same id two ways — the picker bundled-first, the export Mine-last-wins
     * — so a Mine document imported under a bundled id (`subtask_act`) went
     * into every later bundle while the picker still showed the bundled name.
     */
    function knownPipelineDocsById() {
        const byId = new Map();
        const add = d => {
            if (d && typeof d.id === 'string' && d.id && !byId.has(d.id)) byId.set(d.id, d);
        };
        BUILTIN_PIPELINE_PRESETS.forEach(add);
        loadUserPipelinePresets().forEach(add);
        return byId;
    }

    /** Reduces any document to the pure single-pipeline shape used in a bundle. */
    function toPurePipelineDoc(doc) {
        const pure = {
            schemaVersion: doc.schemaVersion || CURRENT_SCHEMA_VERSION,
            id: doc.id,
            name: doc.name || 'Untitled pipeline',
            updatedAt: doc.updatedAt || Date.now(),
            nodes: doc.nodes || [],
            connections: doc.connections || [],
        };
        // Optional pipeline-level fields are carried, not rebuilt away: this
        // function is the bundle's normalizer, and anything it forgets is
        // silently lost for every pipeline in the closure — including the
        // imported preset documents that supply `samplePrompts`.
        if (typeof doc.memoryRetrievalQuery === 'string' && doc.memoryRetrievalQuery.trim()) {
            pure.memoryRetrievalQuery = doc.memoryRetrievalQuery;
        }
        if (Array.isArray(doc.samplePrompts) && doc.samplePrompts.length > 0) {
            pure.samplePrompts = doc.samplePrompts;
        }
        return pure;
    }

    /** Collects the PIPELINE `targetPipelineId`s referenced by a document's nodes. */
    function pipelineTargetsOf(doc) {
        return (doc.nodes || [])
            .filter(n => n.type === 'PIPELINE')
            .map(n => (n.config && n.config.targetPipelineId) || (n.data && n.data.targetPipelineId) || '')
            .filter(id => typeof id === 'string' && id.length > 0);
    }

    /**
     * Walks the dependency closure of the current canvas over the Mine +
     * Bundled catalogues. Returns `{ pipelines }` on success, or `{ error }`
     * when a dependency is unresolved (a bundle must be self-contained) or the
     * closure exceeds the pipeline limit — the browser analogue of Android's
     * fail-fast export.
     */
    function collectBundleClosure() {
        const rootDoc = exportToJson();
        const byId = knownPipelineDocsById();

        const collected = new Map();
        const unresolved = new Set();
        const queue = [rootDoc];
        while (queue.length) {
            const doc = queue.shift();
            if (!doc || collected.has(doc.id)) continue;
            collected.set(doc.id, toPurePipelineDoc(doc));
            pipelineTargetsOf(doc).forEach(targetId => {
                if (collected.has(targetId)) return;
                const dep = byId.get(targetId);
                if (dep) queue.push(dep); else unresolved.add(targetId);
            });
        }

        if (unresolved.size > 0) {
            return { error: 'Cannot export bundle — these PIPELINE dependencies are not among the ' +
                'Bundled or Mine presets: ' + Array.from(unresolved).join(', ') +
                '. Save them as presets first.' };
        }
        if (collected.size > MAX_BUNDLE_PIPELINES) {
            return { error: `Dependency closure exceeds the limit of ${MAX_BUNDLE_PIPELINES} pipelines.` };
        }
        return { pipelines: Array.from(collected.values()) };
    }

    exportBundleBtn.addEventListener('click', () => {
        // The root must itself be valid, matching the plain Export gate.
        if (validateGraph().errors.length > 0) return;
        const result = collectBundleClosure();
        if (result.error) { alert(result.error); return; }
        downloadJson({
            bundleVersion: CURRENT_BUNDLE_VERSION,
            exportedAt: Date.now(),
            pipelines: result.pipelines,
        }, `knotwork-bundle-${todayStamp()}.json`);
    });

    /**
     * Parses and validates a bundle envelope, enforcing the same invariants as
     * the Android parser: a `bundleVersion`, a non-empty `pipelines` array
     * within the limit, a structurally sound document per element, no duplicate
     * pipeline ids, and full referential integrity (every PIPELINE
     * `targetPipelineId` resolves to a pipeline in the bundle).
     */
    function parseBundleDoc(text) {
        let doc;
        try {
            doc = JSON.parse(text);
        } catch (e) {
            return { error: 'Failed to parse JSON: ' + e.message };
        }
        if (!doc || typeof doc !== 'object' || Array.isArray(doc)) {
            return { error: 'File does not contain a valid JSON document.' };
        }
        if (typeof doc.bundleVersion === 'undefined') return { error: 'Not a bundle (missing bundleVersion).' };
        if (!Array.isArray(doc.pipelines) || doc.pipelines.length === 0) {
            return { error: 'Bundle contains no pipelines.' };
        }
        if (doc.pipelines.length > MAX_BUNDLE_PIPELINES) {
            return { error: `Bundle contains ${doc.pipelines.length} pipelines, exceeding the limit of ` +
                `${MAX_BUNDLE_PIPELINES}.` };
        }
        for (let i = 0; i < doc.pipelines.length; i++) {
            const structureError = pipelineDocStructureError(doc.pipelines[i]);
            if (structureError) return { error: `Bundle pipeline #${i}: ${structureError}` };
        }
        const ids = doc.pipelines.map(p => p.id);
        const duplicate = ids.find((id, i) => ids.indexOf(id) !== i);
        if (duplicate) return { error: `Bundle contains duplicate pipeline id "${duplicate}".` };
        const idSet = new Set(ids);
        for (const p of doc.pipelines) {
            const dangling = pipelineTargetsOf(p).find(t => !idSet.has(t));
            if (dangling) return { error: `Bundle references pipeline "${dangling}" that it does not contain.` };
        }
        return { doc };
    }

    /* ---- Import bundle → "Mine" (non-destructive; never touches canvas) ---- */
    importBundleBtn.addEventListener('click', () => fileImportBundleInput.click());
    fileImportBundleInput.addEventListener('change', e => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;
        fileImportBundleInput.value = '';
        const reader = new FileReader();
        reader.onload = () => {
            const res = parseBundleDoc(reader.result);
            if (res.error) { alert('Failed to import bundle: ' + res.error); return; }
            // Only a real, numeric, older/newer schemaVersion counts as a
            // mismatch — a missing schemaVersion is treated as current (avoids a
            // 'schema vundefined' prompt), matching export's default.
            const mismatched = res.doc.pipelines.find(
                p => typeof p.schemaVersion === 'number' && p.schemaVersion !== CURRENT_SCHEMA_VERSION,
            );
            if (mismatched && !confirmPresetSchema({ schemaVersion: mismatched.schemaVersion })) return;
            let list = loadUserPipelinePresets();
            const incomingIds = new Set(res.doc.pipelines.map(p => p.id).filter(Boolean));
            // Drop any existing Mine preset the bundle re-supplies, so a re-import
            // replaces in place instead of leaving ambiguous duplicate-id entries.
            list = list.filter(p => !incomingIds.has(p.id));
            // Prepend in reverse so the bundle's own order is preserved in Mine.
            res.doc.pipelines.slice().reverse().forEach(p => {
                list.unshift(Object.assign({}, p, { id: p.id || generateUuid(), savedAt: Date.now() }));
            });
            saveUserPipelinePresets(list);
            presetActiveTab = 'mine';
            openPresetLibrary();
        };
        reader.onerror = () => alert('Failed to read file.');
        reader.readAsText(file);
    });

    // Re-validation on dialog save and on undo/redo lives inside the
    // original commitDialog / applySnapshot bodies (see below) — function
    // declarations are hoisted so they can call runValidation() defined
    // here without a forward-declaration dance.

    // Initial empty snapshot so undo "back to blank" works after first action.
    pushSnapshot();
    updateToolbar();
    runValidation();

    // Expose for manual debugging in DevTools
    window.__editor = editor;
    window.__labels = connectionLabels;
    window.__validate = validateGraph;
    window.__exportJson = exportToJson;
    window.__importJson = importFromJson;
    window.__exportPresetJson = exportToPresetJson;
    window.__pipelinePresets = BUILTIN_PIPELINE_PRESETS;
    window.__openPresetLibrary = openPresetLibrary;
    window.__collectBundleClosure = collectBundleClosure;
    window.__parseBundleDoc = parseBundleDoc;
</script>
</body>
</html>
